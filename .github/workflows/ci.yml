name: CI

on:
  # No paths-ignore: the secret scan must run on every change, docs included.
  push:
    branches: [gta-vi-channel]   # the default branch (this fork has no master)
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0               # full history for the secret scan
          persist-credentials: false
      - name: Secret scan (entire history, every run)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner

  test:
    runs-on: ubuntu-latest
    env:
      # Unit tests never launch a browser; skip Puppeteer's Chromium download
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
